version: "3.9"

services:
  db:
    image: postgres:16
    container_name: supply-postgres
    restart: always
    environment:
      POSTGRES_DB: supply_db
      POSTGRES_USER: supply_user
      POSTGRES_PASSWORD: supply_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supply-backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: supply-frontend
    restart: always
    environment:
      VITE_API_URL: "http://localhost:8000"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pg_data:
